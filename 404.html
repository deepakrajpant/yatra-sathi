<!doctype html>
<html><head><meta charset="utf-8"><title>YatraSathi</title>
<script>
(function(){
  var l=window.location;
  var base="/yatra-sathi/";
  if(l.pathname.indexOf(base)!==0)return;
  var route=l.pathname.slice(base.length);
  sessionStorage.setItem("yatra-redirect", route + l.search + l.hash);
  l.replace(base);
})();
</script>
</head><body>Redirecting to YatraSathi…</body></html>
